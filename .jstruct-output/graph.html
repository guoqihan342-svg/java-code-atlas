<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>JavaStruct</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.0/dist/cytoscape.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display:flex; flex-direction:column; height:100vh; background:#0f172a; color:#e2e8f0; }
    header { padding:12px 20px; background:#1e293b; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; }
    header strong { font-size:18px; }
    main { display:flex; flex:1; overflow:hidden; }
    aside { width:280px; background:#1e293b; padding:16px; overflow-y:auto; border-right:1px solid #334155; }
    section { flex:1; position:relative; }
    .views { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
    .views button { padding:10px; border:1px solid #334155; background:#0f172a; color:#94a3b8; cursor:pointer; border-radius:6px; font-size:14px; text-align:left; }
    .views button.active { background:#2563eb; color:white; border-color:#2563eb; }
    #stage { position:relative; min-width:0; }
    #stage > div, #stage > svg { position:absolute; inset:0; display:none; width:100%; height:100%; }
    #stage > div.active, #stage > svg.active { display:block; }
    #tooltip { position:absolute; padding:8px 12px; background:#1e293b; border:1px solid #334155; border-radius:6px; font-size:12px; pointer-events:none; display:none; z-index:100; max-width:360px; }
    #status-bar { padding:8px 20px; background:#1e293b; font-size:12px; color:#94a3b8; display:flex; gap:20px; border-top:1px solid #334155; }
    #summary { font-size:13px; line-height:1.7; color:#cbd5e1; }
    .muted { color:#94a3b8; }
  </style>
</head>
<body>
<header>
  <strong>JavaStruct</strong>
  <span id="project-name"></span>
</header>
<main>
  <aside>
    <div class="views">
      <button id="btn-topo" class="active" onclick="switchView('topo')">依赖拓扑</button>
      <button id="btn-matrix" onclick="switchView('matrix')">A/I 矩阵</button>
      <button id="btn-layers" onclick="switchView('layers')">分层透视</button>
      <button id="btn-hot" onclick="switchView('hot')">热点热力</button>
    </div>
    <div id="summary"></div>
  </aside>
  <section id="stage">
    <div id="topo" class="active"></div>
    <svg id="matrix"></svg>
    <svg id="layers"></svg>
    <svg id="hot"></svg>
    <div id="tooltip"></div>
  </section>
</main>
<div id="status-bar">
  <span id="status-text">加载中...</span>
  <span id="update-time"></span>
</div>

<script>
let java_struct = null;
let cy = null;
let wsConnected = false;
const tooltip = document.getElementById('tooltip');

async function loadJavaStruct() {
  try {
    const resp = await fetch('/api/java_struct.json');
    if (!resp.ok) throw new Error(await resp.text());
    java_struct = await resp.json();
    const meta = java_struct.java_struct || {};
    document.getElementById('project-name').textContent = meta.project || '';
    document.getElementById('status-text').textContent =
      `${meta.totalModules || java_struct.modules?.length || 0}模块 · ${meta.totalEntities || java_struct.entities?.length || 0}类 · ${meta.totalRelationships || java_struct.relationships?.length || 0}关系`;
    renderCurrentView();
    updateSummary();
    if (!wsConnected) connectWebSocket();
  } catch (e) {
    document.getElementById('status-text').textContent = `图谱加载失败: ${e.message}`;
  }
}

function connectWebSocket() {
  wsConnected = true;
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${location.host}/ws`);
  ws.onmessage = (event) => {
    const delta = JSON.parse(event.data);
    if (delta.type === 'incremental') {
      applyDelta(delta);
    } else if (delta.type === 'full-reload') {
      loadJavaStruct();
    } else if (delta.type === 'status') {
      document.getElementById('status-text').textContent = delta.status;
    } else if (delta.type === 'error') {
      document.getElementById('status-text').textContent = `扫描失败: ${delta.error}`;
    }
  };
  ws.onclose = () => {
    wsConnected = false;
    setTimeout(connectWebSocket, 2000);
  };
}

function applyDelta(delta) {
  (delta.changed || []).forEach(item => {
    if (item.type === 'entity' && cy) {
      const node = cy.getElementById(item.fqn);
      if (node.length) node.data(item.data);
    }
  });
  document.getElementById('update-time').textContent =
    `最后更新: ${new Date().toLocaleTimeString()}`;
}

function renderTopology() {
  if (!java_struct) return;
  const elements = [];
  (java_struct.entities || []).forEach(e => {
    elements.push({ data: { id: e.fqn, label: e.className || shortName(e.fqn), module: e.module, roles: e.roles || [] } });
  });
  (java_struct.relationships || []).forEach((r, idx) => {
    if (!r.source || !r.target) return;
    elements.push({ data: { id: `${r.source}->${r.target}-${idx}`, source: r.source, target: r.target, weight: r.weight || 1, type: r.type || 'DEPENDS' } });
  });

  cy = cytoscape({
    container: document.getElementById('topo'),
    elements: elements,
    style: [
      { selector: 'node', style: {
        'label': 'data(label)',
        'background-color': ele => roleColor(ele.data('roles')),
        'width': ele => Math.max(20, Math.min(60, ele.degree() * 4 + 20)),
        'height': ele => Math.max(20, Math.min(60, ele.degree() * 4 + 20)),
        'font-size': '10px',
        'color': '#e2e8f0',
        'text-outline-width': 2,
        'text-outline-color': '#0f172a'
      }},
      { selector: 'edge', style: {
        'width': ele => Math.max(1, Math.min(5, ele.data('weight'))),
        'line-color': ele => isCyclic(ele) ? '#ef4444' : '#475569',
        'target-arrow-color': ele => isCyclic(ele) ? '#ef4444' : '#475569',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier'
      }}
    ],
    layout: { name: 'cose', animate: false, fit: true, padding: 40 }
  });

  cy.on('tap mouseover', 'node', (evt) => {
    const node = evt.target;
    tooltip.innerHTML = `<b>${node.data('label')}</b><br>模块: ${node.data('module') || '-'}<br>角色: ${(node.data('roles') || []).join(', ') || '-'}<br>度: ${node.degree()}`;
    tooltip.style.display = 'block';
    if (evt.originalEvent) {
      tooltip.style.left = evt.originalEvent.clientX + 10 + 'px';
      tooltip.style.top = evt.originalEvent.clientY + 10 + 'px';
    }
  });
  cy.on('mouseout', 'node', () => { tooltip.style.display = 'none'; });
}

function roleColor(roles) {
  if (!roles || !roles.length) return '#64748b';
  if (roles.includes('REST_ENTRY')) return '#16a34a';
  if (roles.includes('BUSINESS_LOGIC')) return '#2563eb';
  if (roles.includes('DATA_ACCESS')) return '#f97316';
  if (roles.includes('CONFIG')) return '#7c3aed';
  return '#64748b';
}

function isCyclic(edge) {
  return edge.data('type') === 'EXTENDS' || edge.data('type') === 'IMPLEMENTS'
    ? false : edge.data('weight') > 5;
}

let currentView = 'topo';
function switchView(view) {
  currentView = view;
  document.querySelectorAll('#stage > div, #stage > svg').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.views button').forEach(b => b.classList.remove('active'));
  document.getElementById(view).classList.add('active');
  document.getElementById('btn-' + view).classList.add('active');
  renderCurrentView();
}

function renderCurrentView() {
  if (currentView === 'topo') renderTopology();
  else if (currentView === 'matrix') renderMatrix();
  else if (currentView === 'layers') renderLayers();
  else if (currentView === 'hot') renderHotspots();
}

function updateSummary() {
  const hotspots = java_struct.metrics?.hotspots || [];
  const cycles = java_struct.metrics?.cycles || [];
  document.getElementById('summary').innerHTML = `
    <p>环依赖: ${cycles.length} 处</p>
    <p>热点类 Top3:</p>
    ${hotspots.slice(0,3).map(h => `<p class="muted">· ${shortName(h.fqn || h.class || '')}</p>`).join('')}
  `;
}

function renderMatrix() {
  const svg = d3.select('#matrix');
  svg.selectAll('*').remove();
  const data = java_struct.metrics?.martin || [];
  const box = svg.node().getBoundingClientRect();
  const w = box.width || 800, h = box.height || 600, margin = 48;
  const x = d3.scaleLinear().domain([0,1]).range([margin, w-margin]);
  const y = d3.scaleLinear().domain([1,0]).range([margin, h-margin]);
  svg.append('g').call(d3.axisBottom(x)).attr('transform', `translate(0,${h-margin})`).attr('color','#94a3b8');
  svg.append('g').call(d3.axisLeft(y)).attr('transform', `translate(${margin},0)`).attr('color','#94a3b8');
  svg.append('text').attr('x', w / 2).attr('y', h - 12).attr('fill','#94a3b8').attr('text-anchor','middle').text('Instability');
  svg.append('text').attr('x', 14).attr('y', h / 2).attr('fill','#94a3b8').attr('transform', `rotate(-90,14,${h / 2})`).attr('text-anchor','middle').text('Abstractness');
  svg.append('line').attr('x1',x(0)).attr('x2',x(1)).attr('y1',y(1)).attr('y2',y(0)).attr('stroke','#334155').attr('stroke-dasharray','5 5');
  svg.selectAll('circle').data(data).enter().append('circle')
    .attr('cx', d => x(Number(d.instability || 0)))
    .attr('cy', d => y(Number(d.abstractness || 0)))
    .attr('r', 7)
    .attr('fill', d => d.zone === 'pain' ? '#ef4444' : d.zone === 'good' ? '#22c55e' : d.zone === 'useless' ? '#eab308' : '#64748b')
    .append('title').text(d => `${d.module}\nI=${Number(d.instability || 0).toFixed(2)} A=${Number(d.abstractness || 0).toFixed(2)}`);
}

function renderLayers() {
  const svg = d3.select('#layers');
  svg.selectAll('*').remove();
  const entities = java_struct.entities || [];
  const groups = d3.group(entities, e => layerOf(e));
  const rows = Array.from(groups, ([layer, items]) => ({layer, count: items.length}));
  const box = svg.node().getBoundingClientRect();
  const w = box.width || 800, h = box.height || 600, margin = 48;
  const x = d3.scaleLinear().domain([0, d3.max(rows, d => d.count) || 1]).range([0, w - margin * 2]);
  const y = d3.scaleBand().domain(rows.map(d => d.layer)).range([margin, h - margin]).padding(0.25);
  svg.append('g').attr('transform', `translate(${margin},0)`).call(d3.axisLeft(y)).attr('color','#94a3b8');
  svg.selectAll('rect').data(rows).enter().append('rect')
    .attr('x', margin).attr('y', d => y(d.layer)).attr('height', y.bandwidth()).attr('width', d => x(d.count))
    .attr('fill', d => layerColor(d.layer));
  svg.selectAll('.label').data(rows).enter().append('text')
    .attr('x', d => margin + x(d.count) + 8).attr('y', d => y(d.layer) + y.bandwidth()/2 + 4)
    .attr('fill','#e2e8f0').text(d => d.count);
}

function renderHotspots() {
  const svg = d3.select('#hot');
  svg.selectAll('*').remove();
  const data = (java_struct.metrics?.hotspots || []).slice(0, 40);
  const box = svg.node().getBoundingClientRect();
  const w = box.width || 800, h = box.height || 600, margin = 40;
  const cols = Math.max(4, Math.floor((w - margin * 2) / 130));
  const cellW = (w - margin * 2) / cols;
  const cellH = 70;
  const color = d3.scaleSequential(d3.interpolateYlOrRd).domain([0, d3.max(data, d => Number(d.score || d.hotspotScore || 1)) || 1]);
  svg.selectAll('rect').data(data).enter().append('rect')
    .attr('x', (d, i) => margin + (i % cols) * cellW)
    .attr('y', (d, i) => margin + Math.floor(i / cols) * cellH)
    .attr('width', cellW - 8).attr('height', cellH - 8).attr('rx', 4)
    .attr('fill', d => color(Number(d.score || d.hotspotScore || 0)));
  svg.selectAll('text').data(data).enter().append('text')
    .attr('x', (d, i) => margin + (i % cols) * cellW + 8)
    .attr('y', (d, i) => margin + Math.floor(i / cols) * cellH + 24)
    .attr('fill','#111827').attr('font-size','12px')
    .text(d => shortName(d.fqn || d.class || '').slice(0, 18));
}

function layerOf(entity) {
  const roles = entity.roles || [];
  const pkg = entity.java_package || entity.javaPackage || '';
  if (roles.includes('REST_ENTRY') || pkg.includes('.controller')) return 'Controller';
  if (roles.includes('BUSINESS_LOGIC') || pkg.includes('.service')) return 'Service';
  if (roles.includes('DATA_ACCESS') || pkg.includes('.repository') || pkg.includes('.dao')) return 'Repository';
  if (roles.includes('PERSISTENCE_MODEL') || pkg.includes('.domain') || pkg.includes('.entity')) return 'Domain';
  if (roles.includes('CONFIG')) return 'Config';
  return 'Other';
}

function layerColor(layer) {
  return {Controller:'#16a34a', Service:'#2563eb', Repository:'#f97316', Domain:'#7c3aed', Config:'#eab308', Other:'#64748b'}[layer] || '#64748b';
}

function shortName(fqn) {
  return String(fqn || '').split('.').pop();
}

loadJavaStruct();
</script>
</body>
</html>
